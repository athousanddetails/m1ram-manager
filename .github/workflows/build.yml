name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install hidapi pyusb pyinstaller libusb-package
      - run: pyinstaller --onefile --windowed --name "M1RAMManager" windows/m1ram_manager.py
      - name: Package
        run: Compress-Archive -Path "dist/M1RAMManager.exe" -DestinationPath "M1-RAM-Manager-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: M1-RAM-Manager-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: gh release upload v1.0 M1-RAM-Manager-windows.zip --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libhidapi-hidraw0 python3-tk
      - run: pip install hidapi pyusb pyinstaller libusb-package
      - run: pyinstaller --onefile --name "m1ram-manager" linux/m1ram_manager.py
      - name: Package
        run: cd dist && tar czf ../M1-RAM-Manager-linux.tar.gz m1ram-manager
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: M1-RAM-Manager-linux.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: gh release upload v1.0 M1-RAM-Manager-linux.tar.gz --clobber --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
